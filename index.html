<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Foot Co. - Showcase Generator</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; margin-top: 0; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; text-align: left; }
        .file-upload { background: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #aaa; }
        input[type="file"], select, input[type="range"] { display: block; width: 100%; color: #fff; }
        select, button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #333; color: #fff; cursor: pointer; }
        button { background: #8B6508; font-weight: bold; text-transform: uppercase; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #a67c00; }
        canvas { max-width: 100%; height: auto; border: 2px solid #8B6508; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Iron Foot Showcase Builder</h1>
    
    <div class="controls">
        <div class="file-upload">
            <label>1. Upload BEFORE Photo</label>
            <input type="file" id="beforeImage" accept="image/*">
        </div>
        
        <div class="file-upload">
            <label>2. Upload AFTER Photo</label>
            <input type="file" id="afterImage" accept="image/*">
        </div>

        <div class="file-upload">
            <label>3. Select Master Template</label>
            <select id="layoutSelect" onchange="generateShowcase()">
                <option value="frame_hh.jpeg">Horizontal / Horizontal (16:9)</option>
                <option value="frame_vv.jpeg">Vertical / Vertical (1:1 Square)</option>
            </select>
        </div>

        <div class="file-upload">
            <label>4. Adjust BEFORE Photo (Up/Down)</label>
            <input type="range" id="beforeY" min="0" max="100" value="50" oninput="generateShowcase()">
        </div>

        <div class="file-upload">
            <label>5. Adjust AFTER Photo (Up/Down)</label>
            <input type="range" id="afterY" min="0" max="100" value="50" oninput="generateShowcase()">
        </div>

        <button onclick="generateShowcase()">Generate Showcase</button>
        <button id="downloadBtn" style="display:none; background:#2e7d32;" onclick="downloadImage()">Download to Device</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let loadedBefore = null;
    let loadedAfter = null;

    document.getElementById('beforeImage').addEventListener('change', async (e) => {
        loadedBefore = await loadImage(e.target.files[0]);
        generateShowcase();
    });
    
    document.getElementById('afterImage').addEventListener('change', async (e) => {
        loadedAfter = await loadImage(e.target.files[0]);
        generateShowcase();
    });

    function loadImage(source) {
        return new Promise((resolve, reject) => {
            if (!source) { resolve(null); return; }
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                alert("Could not load frame image. Make sure your JPEG files are uploaded to GitHub and named correctly.");
                reject();
            };
            if (typeof source === 'string') {
                img.src = source; 
            } else {
                const reader = new FileReader();
                reader.onload = (e) => img.src = e.target.result;
                reader.readAsDataURL(source);
            }
        });
    }

    // Cover image but with slider-controlled Y-offset panning
    function drawImagePan(img, x, y, w, h, offsetYPercent) {
        const scale = Math.max(w / img.width, h / img.height);
        const nw = img.width * scale;
        const nh = img.height * scale;
        const nx = x + (w - nw) / 2; // Always center horizontally
        
        // Calculate vertical panning limits so it never shows empty background
        const maxNy = y;
        const minNy = y - (nh - h);
        const ny = minNy + (maxNy - minNy) * (offsetYPercent / 100);
        
        ctx.drawImage(img, nx, ny, nw, nh);
    }

    async function generateShowcase() {
        if (!loadedBefore || !loadedAfter) return;

        const frameFilename = document.getElementById('layoutSelect').value;
        const beforeY = 100 - document.getElementById('beforeY').value; // Invert slider for natural feel
        const afterY = 100 - document.getElementById('afterY').value;

        const frameImg = await loadImage(frameFilename);

        const W = frameImg.width;
        const H = frameImg.height;
        canvas.width = W;
        canvas.height = H;

        // LAYER 1: Base Frame
        ctx.drawImage(frameImg, 0, 0, W, H);

        // Define overly generous photo bounds (they bleed under the borders to kill the white halo)
        const leftBox = { x: W * 0.03, y: H * 0.15, w: W * 0.47, h: H * 0.70 };
        const rightBox = { x: W * 0.50, y: H * 0.15, w: W * 0.47, h: H * 0.70 };

        // LAYER 2: Draw Photos with User Panning
        ctx.save();
        ctx.beginPath();
        ctx.rect(leftBox.x, leftBox.y, leftBox.w, leftBox.h);
        ctx.clip();
        drawImagePan(loadedBefore, leftBox.x, leftBox.y, leftBox.w, leftBox.h, beforeY);
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(rightBox.x, rightBox.y, rightBox.w, rightBox.h);
        ctx.clip();
        drawImagePan(loadedAfter, rightBox.x, rightBox.y, rightBox.w, rightBox.h, afterY);
        ctx.restore();

        // LAYER 3: The Frame Stamp Sandwich
        // Top Header (Covers the top seam)
        ctx.drawImage(frameImg, 0, 0, W, H * 0.195, 0, 0, W, H * 0.195);
        // Bottom Footer (Covers the bottom seam)
        ctx.drawImage(frameImg, 0, H * 0.815, W, H * 0.185, 0, H * 0.815, W, H * 0.185);
        // Center Pillar & Badge (Covers the middle seam)
        ctx.drawImage(frameImg, W * 0.35, 0, W * 0.30, H, W * 0.35, 0, W * 0.30, H);
        // Left Outer Border (Covers the left seam)
        ctx.drawImage(frameImg, 0, 0, W * 0.045, H, 0, 0, W * 0.045, H);
        // Right Outer Border (Covers the right seam)
        ctx.drawImage(frameImg, W * 0.955, 0, W * 0.045, H, W * 0.955, 0, W * 0.045, H);

        canvas.style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'IronFoot_Showcase_Final.jpeg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }
</script>
</body>
</html>
