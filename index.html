<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Foot Co. - Showcase Generator</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; margin-top: 0; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; text-align: left; }
        .file-upload { background: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #aaa; }
        input[type="file"] { display: block; width: 100%; color: #fff; }
        select, button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #333; color: #fff; cursor: pointer; }
        button { background: #8B6508; font-weight: bold; text-transform: uppercase; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #a67c00; }
        canvas { max-width: 100%; height: auto; border: 2px solid #8B6508; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Iron Foot Showcase Builder</h1>
    
    <div class="controls">
        <div class="file-upload">
            <label>1. Upload BEFORE Photo</label>
            <input type="file" id="beforeImage" accept="image/*">
        </div>
        
        <div class="file-upload">
            <label>2. Upload AFTER Photo</label>
            <input type="file" id="afterImage" accept="image/*">
        </div>

        <div class="file-upload">
            <label>3. Select Master Template</label>
            <select id="layoutSelect">
                <option value="frame_hh.jpeg">Horizontal / Horizontal (16:9)</option>
                <option value="frame_vv.jpeg">Vertical / Vertical (1:1 Square)</option>
            </select>
        </div>

        <button onclick="generateShowcase()">Generate Showcase</button>
        <button id="downloadBtn" style="display:none; background:#2e7d32;" onclick="downloadImage()">Download to Device</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function loadImage(source) {
        return new Promise((resolve, reject) => {
            if (!source) { resolve(null); return; }
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                alert("Could not load frame image. Make sure your JPEG files are uploaded to GitHub and named exactly matching the dropdown.");
                reject();
            };
            
            if (typeof source === 'string') {
                img.src = source; 
            } else {
                const reader = new FileReader();
                reader.onload = (e) => img.src = e.target.result;
                reader.readAsDataURL(source);
            }
        });
    }

    // Changed from Cover to Fit so zero pixels are cropped
    function drawImageFit(img, x, y, w, h) {
        const scale = Math.min(w / img.width, h / img.height);
        const nw = img.width * scale;
        const nh = img.height * scale;
        const nx = x + (w - nw) / 2;
        const ny = y + (h - nh) / 2;
        ctx.drawImage(img, nx, ny, nw, nh);
    }

    async function generateShowcase() {
        const beforeFile = document.getElementById('beforeImage').files[0];
        const afterFile = document.getElementById('afterImage').files[0];
        const frameFilename = document.getElementById('layoutSelect').value;

        if (!beforeFile || !afterFile) {
            alert("Please upload both a Before and After photo.");
            return;
        }

        const imgBefore = await loadImage(beforeFile);
        const imgAfter = await loadImage(afterFile);
        const frameImg = await loadImage(frameFilename);

        const W = frameImg.width;
        const H = frameImg.height;
        canvas.width = W;
        canvas.height = H;

        // 1. DYNAMIC CHROMA-KEY (Create Transparent Frame Cutout)
        const offCanvas = document.createElement('canvas');
        offCanvas.width = W;
        offCanvas.height = H;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(frameImg, 0, 0, W, H);
        const imgData = offCtx.getImageData(0, 0, W, H);
        const data = imgData.data;

        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const i = (y * W + x) * 4;
                
                // Target very bright white (the blank windows are pure white)
                if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) {
                    
                    // Protect Logo Text
                    const inLogoText = (x > W * 0.40 && x < W * 0.60 && y < H * 0.22);
                    // Protect Footer Text
                    const inFooterText = (y > H * 0.88);

                    if (!inLogoText && !inFooterText) {
                        data[i+3] = 0; 
                    }
                }
            }
        }
        offCtx.putImageData(imgData, 0, 0);

        // 2. DRAW BASE PHOTOS (Strictly inside the windows using FIT)
        ctx.fillStyle = '#111'; // Clean dark background behind images
        ctx.fillRect(0, 0, W, H);

        let leftBox, rightBox;
        if (frameFilename === 'frame_hh.jpeg') {
            leftBox =  { x: W * 0.038, y: H * 0.178, w: W * 0.448, h: H * 0.675 };
            rightBox = { x: W * 0.514, y: H * 0.178, w: W * 0.448, h: H * 0.675 };
        } else {
            leftBox =  { x: W * 0.035, y: H * 0.165, w: W * 0.445, h: H * 0.678 };
            rightBox = { x: W * 0.520, y: H * 0.165, w: W * 0.445, h: H * 0.678 };
        }

        ctx.save();
        ctx.beginPath();
        ctx.rect(leftBox.x, leftBox.y, leftBox.w, leftBox.h);
        ctx.clip();
        drawImageFit(imgBefore, leftBox.x, leftBox.y, leftBox.w, leftBox.h);
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(rightBox.x, rightBox.y, rightBox.w, rightBox.h);
        ctx.clip();
        drawImageFit(imgAfter, rightBox.x, rightBox.y, rightBox.w, rightBox.h);
        ctx.restore();

        // 3. DROP THE TRANSPARENT FRAME ON TOP
        ctx.drawImage(offCanvas, 0, 0, W, H);

        canvas.style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'IronFoot_Showcase_Final.jpeg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }
</script>
</body>
</html>
