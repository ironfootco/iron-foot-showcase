<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Foot Co. - Showcase Generator</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; margin-top: 0; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; text-align: left; }
        .file-upload { background: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        .status-tag { font-size: 12px; font-weight: normal; margin-left: 10px; color: #ff5252; }
        .status-tag.ready { color: #4caf50; }
        input[type="file"], select { display: block; width: 100%; color: #fff; margin-bottom: 10px; }
        .slider-group { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
        .slider-group div { flex: 1; text-align: center; }
        .slider-group input[type="range"] { width: 100%; margin-top: 5px; }
        .slider-label { font-size: 12px; color: #888; text-transform: uppercase; }
        .btn-center { 
            background: #444; 
            color: #ddd; 
            padding: 6px 12px; 
            font-size: 12px; 
            font-weight: 600; 
            border-radius: 4px; 
            border: 1px solid #555; 
            cursor: pointer; 
            display: inline-block;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-center:hover { background: #555; color: #fff; }
        select, button.main-btn { padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #333; color: #fff; cursor: pointer; }
        button.main-btn { background: #8B6508; font-weight: bold; text-transform: uppercase; margin-top: 10px; transition: background 0.2s; width: 100%; }
        button.main-btn:hover { background: #a67c00; }
        canvas { max-width: 100%; height: auto; border: 2px solid #8B6508; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Iron Foot Showcase Builder</h1>
    
    <div class="controls">
        <div class="file-upload">
            <label>1. Select Master Template</label>
            <select id="layoutSelect" onchange="runGenerate(false)">
                <option value="frame_vv_solid.jpeg" selected>Vertical / Vertical (1:1 Square)</option>
                <option value="frame_stack_solid.jpeg">Horizontal / Horizontal (4:5 Over/Under)</option>
            </select>
        </div>

        <div class="file-upload">
            <label>2. Upload BEFORE Photo <span id="bStatus" class="status-tag">Missing</span></label>
            <input type="file" id="beforeImage" accept="image/*">
            <div class="slider-group">
                <div><span class="slider-label">Zoom</span><input type="range" id="bZoom" min="10" max="300" value="100" oninput="runGenerate(false)"></div>
                <div><span class="slider-label">Left / Right</span><input type="range" id="bX" min="-200" max="200" value="0" oninput="runGenerate(false)"></div>
                <div><span class="slider-label">Up / Down</span><input type="range" id="bY" min="-200" max="200" value="0" oninput="runGenerate(false)"></div>
            </div>
            <button type="button" class="btn-center" onclick="resetBeforePosition()">Center Photo</button>
        </div>
        
        <div class="file-upload">
            <label>3. Upload AFTER Photo <span id="aStatus" class="status-tag">Missing</span></label>
            <input type="file" id="afterImage" accept="image/*">
            <div class="slider-group">
                <div><span class="slider-label">Zoom</span><input type="range" id="aZoom" min="10" max="300" value="100" oninput="runGenerate(false)"></div>
                <div><span class="slider-label">Left / Right</span><input type="range" id="aX" min="-200" max="200" value="0" oninput="runGenerate(false)"></div>
                <div><span class="slider-label">Up / Down</span><input type="range" id="aY" min="-200" max="200" value="0" oninput="runGenerate(false)"></div>
            </div>
            <button type="button" class="btn-center" onclick="resetAfterPosition()">Center Photo</button>
        </div>

        <button class="main-btn" onclick="runGenerate(true)">Generate Showcase</button>
        <button id="downloadBtn" class="main-btn" style="display:none; background:#2e7d32;" onclick="downloadImage()">Download to Device</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let loadedBefore = null;
    let loadedAfter = null;

    document.getElementById('beforeImage').addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
            try {
                loadedBefore = await loadImage(e.target.files[0]);
                const status = document.getElementById('bStatus');
                status.textContent = 'Loaded ✓';
                status.className = 'status-tag ready';
                runGenerate(false);
            } catch (err) {
                console.error(err);
            }
        }
    });
    
    document.getElementById('afterImage').addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
            try {
                loadedAfter = await loadImage(e.target.files[0]);
                const status = document.getElementById('aStatus');
                status.textContent = 'Loaded ✓';
                status.className = 'status-tag ready';
                runGenerate(false);
            } catch (err) {
                console.error(err);
            }
        }
    });

    function resetBeforePosition() {
        document.getElementById('bX').value = 0;
        document.getElementById('bY').value = 0;
        runGenerate(false);
    }

    function resetAfterPosition() {
        document.getElementById('aX').value = 0;
        document.getElementById('aY').value = 0;
        runGenerate(false);
    }

    function loadImage(source) {
        return new Promise((resolve, reject) => {
            if (!source) { resolve(null); return; }
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                const name = typeof source === 'string' ? source : 'Uploaded File';
                alert(`Error loading image: ${name}. Ensure it exists in the repo.`);
                reject(new Error(`Failed to load ${name}`));
            };
            if (typeof source === 'string') {
                img.src = source;
            } else {
                img.src = URL.createObjectURL(source);
            }
        });
    }

    async function runGenerate(isManualClick) {
        if (!loadedBefore || !loadedAfter) {
            if (isManualClick) {
                alert(`Please upload both photos first.\n- BEFORE: ${loadedBefore ? 'Ready' : 'MISSING'}\n- AFTER: ${loadedAfter ? 'Ready' : 'MISSING'}`);
            }
            return;
        }

        try {
            const frameFilename = document.getElementById('layoutSelect').value;
            const frameImg = await loadImage(frameFilename);

            const W = frameImg.width;
            const H = frameImg.height;
            canvas.width = W;
            canvas.height = H;

            // LAYER 1: BASE BACKGROUND
            ctx.drawImage(frameImg, 0, 0, W, H);

            // LAYER 2: DRAW PHOTOS
            if (frameFilename === 'frame_stack_solid.jpeg') {
                // BEFORE (Top Window)
                let bZoom = document.getElementById('bZoom').value / 100;
                let baseBeforeScale = (W / loadedBefore.width);
                let bW = loadedBefore.width * baseBeforeScale * bZoom;
                let bH = loadedBefore.height * baseBeforeScale * bZoom;

                let bX = (W / 2) + (document.getElementById('bX').value / 100) * (W / 2);
                let bY = (H * 0.31) + (document.getElementById('bY').value / 100) * (H * 0.35);

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W, H * 0.48);
                ctx.clip();
                ctx.drawImage(loadedBefore, bX - bW / 2, bY - bH / 2, bW, bH);
                ctx.restore();

                // AFTER (Bottom Window)
                let aZoom = document.getElementById('aZoom').value / 100;
                let baseAfterScale = (W / loadedAfter.width);
                let aW = loadedAfter.width * baseAfterScale * aZoom;
                let aH = loadedAfter.height * baseAfterScale * aZoom;

                let aX = (W / 2) + (document.getElementById('aX').value / 100) * (W / 2);
                let aY = (H * 0.715) + (document.getElementById('aY').value / 100) * (H * 0.35);

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, H * 0.50, W, H * 0.50);
                ctx.clip();
                ctx.drawImage(loadedAfter, aX - aW / 2, aY - aH / 2, aW, aH);
                ctx.restore();

            } else {
                // SIDE-BY-SIDE SQUARE (frame_vv_solid)
                let bZoom = document.getElementById('bZoom').value / 100;
                let bX = (W / 4) + (document.getElementById('bX').value / 100) * (W / 2);
                let bY = (H / 2) + (document.getElementById('bY').value / 100) * (H / 2);
                let bW = loadedBefore.width * bZoom;
                let bH = loadedBefore.height * bZoom;

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W / 2, H);
                ctx.clip();
                ctx.drawImage(loadedBefore, bX - bW / 2, bY - bH / 2, bW, bH);
                ctx.restore();

                let aZoom = document.getElementById('aZoom').value / 100;
                let aX = (W * 0.75) + (document.getElementById('aX').value / 100) * (W / 2);
                let aY = (H / 2) + (document.getElementById('aY').value / 100) * (H / 2);
                let aW = loadedAfter.width * aZoom;
                let aH = loadedAfter.height * aZoom;

                ctx.save();
                ctx.beginPath();
                ctx.rect(W / 2, 0, W / 2, H);
                ctx.clip();
                ctx.drawImage(loadedAfter, aX - aW / 2, aY - aH / 2, aW, aH);
                ctx.restore();
            }

            // LAYER 3: EXACT-CUT SANDWICH OVERLAY STAMPS
            if (frameFilename === 'frame_stack_solid.jpeg') {
                // 4:5 Stack Tuned Overlays
                const topH = H * 0.150;
                const botY = H * 0.895;
                const botH = H * 0.105;
                const divY = H * 0.478;
                const divH = H * 0.052;
                
                // Top Right Badge
                const badgeX = W * 0.730;
                const badgeY = 0;
                const badgeW = W * 0.205;
                const badgeH = H * 0.198;
                
                // After Box Cutout Stamp
                const afterBoxX = W * 0.570;
                const afterBoxY = H * 0.465;
                const afterBoxW = W * 0.400;
                const afterBoxH = H * 0.105;

                const edgeW = W * 0.046;

                // 1. Top Header
                ctx.drawImage(frameImg, 0, 0, W, topH, 0, 0, W, topH);
                // 2. Bottom Footer
                ctx.drawImage(frameImg, 0, botY, W, botH, 0, botY, W, botH);
                // 3. Center Horizontal Divider Bar
                ctx.drawImage(frameImg, 0, divY, W, divH, 0, divY, W, divH);
                // 4. Stamped AFTER Box (Protects text & border)
                ctx.drawImage(frameImg, afterBoxX, afterBoxY, afterBoxW, afterBoxH, afterBoxX, afterBoxY, afterBoxW, afterBoxH);
                // 5. Top Right Logo Badge
                ctx.drawImage(frameImg, badgeX, badgeY, badgeW, badgeH, badgeX, badgeY, badgeW, badgeH);
                // 6. Left & Right Outer Borders
                ctx.drawImage(frameImg, 0, 0, edgeW, H, 0, 0, edgeW, H);
                ctx.drawImage(frameImg, W - edgeW, 0, edgeW, H, W - edgeW, 0, edgeW, H);

            } else {
                // 1:1 Square (frame_vv_solid)
                const topH = H * 0.168;
                const botY = H * 0.872;
                const botH = H * 0.128;
                const divX = W * 0.470;
                const divW = W * 0.060;
                const badgeX = W * 0.400;
                const badgeW = W * 0.200;
                const badgeH = H * 0.215;
                const edgeW = W * 0.045;

                ctx.drawImage(frameImg, 0, 0, W, topH, 0, 0, W, topH);
                ctx.drawImage(frameImg, 0, botY, W, botH, 0, botY, W, botH);
                ctx.drawImage(frameImg, divX, 0, divW, H, divX, 0, divW, H);
                ctx.drawImage(frameImg, badgeX, 0, badgeW, badgeH, badgeX, 0, badgeW, badgeH);
                ctx.drawImage(frameImg, 0, 0, edgeW, H, 0, 0, edgeW, H);
                ctx.drawImage(frameImg, W - edgeW, 0, edgeW, H, W - edgeW, 0, edgeW, H);
            }

            canvas.style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
            
        } catch (error) {
            alert("Error rendering showcase: " + error.message);
        }
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'IronFoot_Showcase_Final.jpeg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }
</script>
</body>
</html>
