<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Foot Co. - Showcase Generator</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; margin-top: 0; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; text-align: left; }
        .file-upload { background: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input[type="file"], select { display: block; width: 100%; color: #fff; margin-bottom: 10px; }
        .slider-group { display: flex; gap: 15px; align-items: center; }
        .slider-group div { flex: 1; text-align: center; }
        .slider-group input[type="range"] { width: 100%; margin-top: 5px; }
        .slider-label { font-size: 12px; color: #888; text-transform: uppercase; }
        select, button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #333; color: #fff; cursor: pointer; }
        button { background: #8B6508; font-weight: bold; text-transform: uppercase; margin-top: 10px; transition: background 0.2s; width: 100%; }
        button:hover { background: #a67c00; }
        canvas { max-width: 100%; height: auto; border: 2px solid #8B6508; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Iron Foot Showcase Builder</h1>
    
    <div class="controls">
        <div class="file-upload">
            <label>1. Select Master Template</label>
            <select id="layoutSelect" onchange="generateShowcase()">
                <option value="frame_vv_solid.jpeg" selected>Vertical / Vertical (1:1 Square)</option>
                <option value="frame_hh.jpeg">Horizontal / Horizontal (16:9)</option>
            </select>
        </div>

        <div class="file-upload">
            <label>2. Upload BEFORE Photo</label>
            <input type="file" id="beforeImage" accept="image/*">
            <div class="slider-group">
                <div><span class="slider-label">Zoom</span><input type="range" id="bZoom" min="10" max="300" value="100" oninput="generateShowcase()"></div>
                <div><span class="slider-label">Left / Right</span><input type="range" id="bX" min="-200" max="200" value="0" oninput="generateShowcase()"></div>
                <div><span class="slider-label">Up / Down</span><input type="range" id="bY" min="-200" max="200" value="0" oninput="generateShowcase()"></div>
            </div>
        </div>
        
        <div class="file-upload">
            <label>3. Upload AFTER Photo</label>
            <input type="file" id="afterImage" accept="image/*">
            <div class="slider-group">
                <div><span class="slider-label">Zoom</span><input type="range" id="aZoom" min="10" max="300" value="100" oninput="generateShowcase()"></div>
                <div><span class="slider-label">Left / Right</span><input type="range" id="aX" min="-200" max="200" value="0" oninput="generateShowcase()"></div>
                <div><span class="slider-label">Up / Down</span><input type="range" id="aY" min="-200" max="200" value="0" oninput="generateShowcase()"></div>
            </div>
        </div>

        <button onclick="manualGenerate()">Generate Showcase</button>
        <button id="downloadBtn" style="display:none; background:#2e7d32;" onclick="downloadImage()">Download to Device</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let loadedBefore = null;
    let loadedAfter = null;

    document.getElementById('beforeImage').addEventListener('change', async (e) => {
        loadedBefore = await loadImage(e.target.files[0]);
        generateShowcase();
    });
    
    document.getElementById('afterImage').addEventListener('change', async (e) => {
        loadedAfter = await loadImage(e.target.files[0]);
        generateShowcase();
    });

    function loadImage(source) {
        return new Promise((resolve, reject) => {
            if (!source) { resolve(null); return; }
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                const filename = typeof source === 'string' ? source : 'Uploaded File';
                alert(`CRITICAL ERROR: Could not load the image: ${filename}. Make sure it is uploaded to GitHub and named exactly like that.`);
                reject(new Error(`Failed to load ${filename}`));
            };
            if (typeof source === 'string') {
                img.src = source; 
            } else {
                const reader = new FileReader();
                reader.onload = (e) => img.src = e.target.result;
                reader.readAsDataURL(source);
            }
        });
    }

    function manualGenerate() {
        if (!loadedBefore || !loadedAfter) {
            alert("Please upload BOTH a Before and After photo first.");
            return;
        }
        generateShowcase();
    }

    async function generateShowcase() {
        if (!loadedBefore || !loadedAfter) return; 

        try {
            const frameFilename = document.getElementById('layoutSelect').value;
            const frameImg = await loadImage(frameFilename);

            const W = frameImg.width;
            const H = frameImg.height;
            canvas.width = W;
            canvas.height = H;

            // LAYER 1: BASE BACKGROUND (The solid frame)
            ctx.drawImage(frameImg, 0, 0, W, H);

            // LAYER 2: DRAW PHOTOS
            let bZoom = document.getElementById('bZoom').value / 100;
            let bX = (W / 4) + (document.getElementById('bX').value / 100) * (W / 2);
            let bY = (H / 2) + (document.getElementById('bY').value / 100) * (H / 2);
            let bW = loadedBefore.width * bZoom;
            let bH = loadedBefore.height * bZoom;

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, W / 2, H);
            ctx.clip();
            ctx.drawImage(loadedBefore, bX - bW / 2, bY - bH / 2, bW, bH);
            ctx.restore();

            let aZoom = document.getElementById('aZoom').value / 100;
            let aX = (W * 0.75) + (document.getElementById('aX').value / 100) * (W / 2);
            let aY = (H / 2) + (document.getElementById('aY').value / 100) * (H / 2);
            let aW = loadedAfter.width * aZoom;
            let aH = loadedAfter.height * aZoom;

            ctx.save();
            ctx.beginPath();
            ctx.rect(W / 2, 0, W / 2, H);
            ctx.clip();
            ctx.drawImage(loadedAfter, aX - aW / 2, aY - aH / 2, aW, aH);
            ctx.restore();

            // LAYER 3: EXACT-CUT SANDWICH OVERLAY STAMPS
            let topH, botY, botH, divX, divW, badgeX, badgeW, badgeH, edgeW;
            
            if (frameFilename === 'frame_hh.jpeg') {
                topH = H * 0.18; botY = H * 0.82; botH = H * 0.18;
                divX = W * 0.485; divW = W * 0.03;
                badgeX = W * 0.40; badgeW = W * 0.20; badgeH = H * 0.28;
                edgeW = W * 0.045;
            } else {
                // Square (1:1) dial-in adjustments
                topH = H * 0.16;                
                botY = H * 0.875; botH = H * 0.125;  // Raised to cover the bottom bleed
                divX = W * 0.4775; divW = W * 0.045; // Widened to cover the center seam
                badgeX = W * 0.39; badgeW = W * 0.22; badgeH = H * 0.215; // Tightened left and right edges
                edgeW = W * 0.045;              
            }

            // Top Header Line
            ctx.drawImage(frameImg, 0, 0, W, topH, 0, 0, W, topH);
            // Bottom Footer Line
            ctx.drawImage(frameImg, 0, botY, W, botH, 0, botY, W, botH);
            // Center Thin Double Divider
            ctx.drawImage(frameImg, divX, 0, divW, H, divX, 0, divW, H);
            // Top Center Logo Badge
            ctx.drawImage(frameImg, badgeX, 0, badgeW, badgeH, badgeX, 0, badgeW, badgeH);
            // Left Outer Border
            ctx.drawImage(frameImg, 0, 0, edgeW, H, 0, 0, edgeW, H);
            // Right Outer Border
            ctx.drawImage(frameImg, W - edgeW, 0, edgeW, H, W - edgeW, 0, edgeW, H);

            canvas.style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
            
        } catch (error) {
            console.error("Error generating showcase:", error);
        }
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'IronFoot_Showcase_Final.jpeg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }
</script>
</body>
</html>
